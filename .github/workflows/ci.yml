name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devsecops_test
          POSTGRES_USER: devsecops_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecops_test -d devsecops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: devsecops_test
      DATABASE_USER: devsecops_test
      DATABASE_PASSWORD: ci_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test

  container:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t devsecops-platform-api:${{ github.sha }} -f apps/api/Dockerfile .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.json
          exit-code: 0

      - name: Save Docker image
        run: docker save devsecops-platform-api:${{ github.sha }} -o api-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: api-sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Container
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: api-image-${{ github.sha }}

      - name: Load Docker image
        run: docker load -i api-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"

      - name: Tag image
        run: |
          docker tag \
            devsecops-platform-api:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:${{ github.sha }}

          docker tag \
            devsecops-platform-api:${{ github.sha }} \
            ${{ steps.image.outputs.name }}:main

      - name: Push container
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:main
