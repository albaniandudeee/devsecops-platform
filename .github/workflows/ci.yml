name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: devsecops_test
          POSTGRES_USER: devsecops_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecops_test -d devsecops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: devsecops_test
      DATABASE_USER: devsecops_test
      DATABASE_PASSWORD: ci_test_password
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run database migrations
        run: npx drizzle-kit migrate

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test

  container:
    name: Build & Scan Containers
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: |
          docker build \
            --target production \
            -t devsecops-platform-api:${{ github.sha }} \
            -f apps/api/Dockerfile .

      - name: Build migration Docker image
        run: |
          docker build \
            --target migration \
            -t devsecops-platform-migrate:${{ github.sha }} \
            -f apps/api/Dockerfile .

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan migration image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-migrate:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate API SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-api:${{ github.sha }}
          format: cyclonedx
          output: api-sbom.json
          exit-code: 0

      - name: Generate migration SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-platform-migrate:${{ github.sha }}
          format: cyclonedx
          output: migration-sbom.json
          exit-code: 0

      - name: Save API image
        run: |
          docker save \
            devsecops-platform-api:${{ github.sha }} \
            -o api-image.tar

      - name: Save migration image
        run: |
          docker save \
            devsecops-platform-migrate:${{ github.sha }} \
            -o migration-image.tar

      - name: Upload API image
        uses: actions/upload-artifact@v4
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload migration image
        uses: actions/upload-artifact@v4
        with:
          name: migration-image-${{ github.sha }}
          path: migration-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload API SBOM
        uses: actions/upload-artifact@v4
        with:
          name: api-sbom-${{ github.sha }}
          path: api-sbom.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload migration SBOM
        uses: actions/upload-artifact@v4
        with:
          name: migration-sbom-${{ github.sha }}
          path: migration-sbom.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Containers
    runs-on: ubuntu-latest
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download API image
        uses: actions/download-artifact@v4
        with:
          name: api-image-${{ github.sha }}

      - name: Download migration image
        uses: actions/download-artifact@v4
        with:
          name: migration-image-${{ github.sha }}

      - name: Load API image
        run: docker load -i api-image.tar

      - name: Load migration image
        run: docker load -i migration-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: images
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "migration=ghcr.io/${GITHUB_REPOSITORY,,}/migrate" >> "$GITHUB_OUTPUT"

      - name: Tag API image
        run: |
          docker tag \
            devsecops-platform-api:${{ github.sha }} \
            ${{ steps.images.outputs.api }}:${{ github.sha }}

          docker tag \
            devsecops-platform-api:${{ github.sha }} \
            ${{ steps.images.outputs.api }}:main

      - name: Tag migration image
        run: |
          docker tag \
            devsecops-platform-migrate:${{ github.sha }} \
            ${{ steps.images.outputs.migration }}:${{ github.sha }}

          docker tag \
            devsecops-platform-migrate:${{ github.sha }} \
            ${{ steps.images.outputs.migration }}:main

      - name: Push API image
        run: |
          docker push ${{ steps.images.outputs.api }}:${{ github.sha }}
          docker push ${{ steps.images.outputs.api }}:main

      - name: Push migration image
        run: |
          docker push ${{ steps.images.outputs.migration }}:${{ github.sha }}
          docker push ${{ steps.images.outputs.migration }}:main
